[workspace]
members = ["crates/assetstudio-core", "crates/assetstudio-cli", "crates/assetstudio-gui", "vendor/unity-rs-core"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Kappu12/AssetStudio"

[workspace.dependencies]
assetstudio-core = { path = "crates/assetstudio-core" }
unity_rs_core = { package = "unity-rs-core", git = "https://github.com/seiunx-dev/unity-rs", rev = "b3e509ed09fe6ff3a897d04ddb75eb5214482265" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[patch."https://github.com/seiunx-dev/unity-rs"]
unity-rs-core = { path = "vendor/unity-rs-core" }
